<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Features Cockpit — ARC Digital Experience</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,'Noto Sans Display',sans-serif;background:#000045;color:#fff;padding:24px;min-height:100vh}
a{color:#A2E3FF;text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:#A2E3FF;margin-bottom:20px}
.back{font-size:12px;margin-bottom:16px;display:inline-block}

/* KPI row */
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.kpi{background:#09009E;border-radius:8px;padding:14px 20px;border-top:3px solid #221AFB;min-width:120px;flex:1}
.kpi .v{font-size:28px;font-weight:700}
.kpi .l{font-size:10px;color:#A2E3FF;margin-top:2px}
.kpi.live{border-top-color:#20C992}.kpi.live .v{color:#20C992}
.kpi.plan{border-top-color:#00B2FF}.kpi.plan .v{color:#00B2FF}
.kpi.gap{border-top-color:#F43653}.kpi.gap .v{color:#F43653}
.kpi.diff{border-top-color:#F1B53D}.kpi.diff .v{color:#F1B53D}
.kpi.parity{border-top-color:#20C992}
.kpi.parity .v{color:#20C992}
.kpi.slip{border-top-color:#F43653}.kpi.slip .v{color:#F43653}

/* Sections */
.section{margin-bottom:28px}
.section h2{font-size:16px;font-weight:700;margin-bottom:10px;color:#A2E3FF;border-bottom:1px solid #221AFB;padding-bottom:6px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
th{text-align:left;padding:8px 10px;background:#09009E;color:#A2E3FF;font-weight:600;border-bottom:2px solid #221AFB}
td{padding:7px 10px;border-bottom:1px solid #090075}
tr:hover td{background:#09009E44}

/* Status pills */
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
.pill.live{background:#20C99233;color:#20C992}
.pill.planned{background:#00B2FF33;color:#00B2FF}
.pill.gap{background:#F4365333;color:#F43653}
.pill.gap-unconfirmed{background:#F4365322;color:#F4365388}
.pill.diff{background:#F1B53D33;color:#F1B53D}
.pill.unverified{background:#80808033;color:#808080}
.pill.conflict{outline:2px solid #FF7514;outline-offset:-1px}

/* Bar */
.bar-track{background:#090075;border-radius:4px;height:16px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-label{position:absolute;right:6px;top:0;line-height:16px;font-size:10px;font-weight:600;color:#fff}

/* Attention queue */
.att-item{background:#09009E;border-radius:6px;padding:10px 14px;margin-bottom:6px;border-left:3px solid #F43653;font-size:12px}
.att-item .reason{color:#F43653;font-size:10px;margin-top:2px}

/* Footer */
.footer{font-size:10px;color:#555;margin-top:32px;text-align:center}

/* Loading */
.loading{text-align:center;padding:60px;color:#A2E3FF;font-size:14px}
</style>
</head>
<body>

<a href="../index.html" class="back">&larr; Back to Dashboard</a>
<h1>Features Cockpit</h1>
<div class="sub">Live operational dashboard &middot; Al Rajhi Capital Digital Experience</div>

<div id="app" class="loading">Loading features.json&hellip;</div>

<script>
(function(){
  const JOURNEYS = [
    "Onboarding","Saudi Market","US Trading",
    "Mutual Funds","Crowd Fund","Robo Advisory",
    "LMS/SBL","IPOs","Cash Management","Platform"
  ];
  const STATUS_ORDER = ["Live","Gap","Gap (unconfirmed)","Planned","Diff","Unverified"];
  const STATUS_COLOR = {Live:"#20C992",Gap:"#F43653","Gap (unconfirmed)":"#F4365388",Planned:"#00B2FF",Diff:"#F1B53D",Unverified:"#808080"};

  // Resolve path to data/features.json relative to this file
  const base = location.pathname.replace(/\/views\/cockpit\.html.*$/,"");
  const dataURL = base + "/data/features_derived.json";

  fetch(dataURL).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(err=>{
    document.getElementById("app").innerHTML = "<p style='color:#F43653'>Failed to load features_derived.json: "+err.message+"</p><p style='margin-top:8px;font-size:12px;color:#A2E3FF'>Run <code>python3 derive_status.py</code> first.</p>";
  });

  function render(json){
    // Containers are scaffolding, not delivered features — excluded from every KPI
    // and maturity count (baseline v1.6.1). They still render in the atlas tree.
    const features = (json.features || []).filter(f=>!f.is_container && f.row_type!=='detail');
    const meta = json._meta || {};
    const today = new Date().toISOString().slice(0,10);

    // --- Compute stats ---
    const total = features.length;
    const ds = f => f.derived_status||f.status||"Unknown";
    const bySt = {};
    STATUS_ORDER.forEach(s=>bySt[s]=0);
    features.forEach(f=>{ const s=ds(f); if(bySt[s]!==undefined) bySt[s]++; });
    const conflicts = features.filter(f=>f.status_conflict).length;

    // Parity: live / (live + confirmed gaps with competitors)
    const gapsWithComp = features.filter(f=>(ds(f)==="Gap"||ds(f)==="Gap (unconfirmed)") && f.competitors && f.competitors.length>0).length;
    const parity = bySt.Live + gapsWithComp > 0 ? Math.round(100 * bySt.Live / (bySt.Live + gapsWithComp)) : 0;

    // Slipped: Planned with live_date < today
    const slipped = features.filter(f=>ds(f)==="Planned" && f.live_date && f.live_date < today);
    const undatedPlanned = features.filter(f=>ds(f)==="Planned" && !f.live_date);
    const missingFigma = features.filter(f=>(ds(f)==="Live"||ds(f)==="Planned") && !f.figma_link);

    // Journey health
    const journeyData = JOURNEYS.map(j=>{
      const jf = features.filter(f=>f.journey===j);
      const jLive = jf.filter(f=>ds(f)==="Live").length;
      const jPlan = jf.filter(f=>ds(f)==="Planned").length;
      const jGap = jf.filter(f=>ds(f)==="Gap"||ds(f)==="Gap (unconfirmed)").length;
      const jDiff = jf.filter(f=>ds(f)==="Diff").length;
      const jUnv = jf.filter(f=>ds(f)==="Unverified").length;
      const jGapComp = jf.filter(f=>(ds(f)==="Gap"||ds(f)==="Gap (unconfirmed)") && f.competitors && f.competitors.length>0).length;
      const jParity = jLive+jGapComp>0 ? Math.round(100*jLive/(jLive+jGapComp)) : (jLive>0?100:0);
      return {journey:j, total:jf.length, live:jLive, planned:jPlan, gap:jGap, diff:jDiff, unverified:jUnv, parity:jParity};
    });

    // Top gaps (sorted by priority ascending, then name)
    const gaps = features.filter(f=>ds(f)==="Gap"||ds(f)==="Gap (unconfirmed)").sort((a,b)=>{
      const pa = a.priority!=null?a.priority:-1;
      const pb = b.priority!=null?b.priority:-1;
      return pb-pa || (a.name||"").localeCompare(b.name||"");
    }).slice(0,15);

    // Top differentiators
    const diffs = features.filter(f=>ds(f)==="Diff").sort((a,b)=>(a.name||"").localeCompare(b.name||""));

    // Quarterly delivery: group planned features with live_date by quarter
    const quarters = {};
    features.filter(f=>ds(f)==="Planned" && f.live_date).forEach(f=>{
      const d = new Date(f.live_date);
      const q = "Q" + (Math.floor(d.getMonth()/3)+1) + " " + d.getFullYear();
      if(!quarters[q]) quarters[q] = [];
      quarters[q].push(f);
    });
    const qKeys = Object.keys(quarters).sort();

    // Attention queue
    const attention = [];
    slipped.forEach(f=>attention.push({name:f.name,id:f.id,reason:"Slipped — target "+f.live_date+" has passed"}));
    undatedPlanned.slice(0,5).forEach(f=>attention.push({name:f.name,id:f.id,reason:"Planned with no target date"}));
    missingFigma.slice(0,5).forEach(f=>attention.push({name:f.name,id:f.id,reason:"No Figma link"}));

    // --- Render ---
    let h = "";

    // KPIs
    h += '<div class="kpis">';
    h += kpi(total,"Total Features","");
    h += kpi(bySt.Live,"Live","live");
    h += kpi(bySt.Gap+(bySt["Gap (unconfirmed)"]||0),"Gaps","gap");
    h += kpi(bySt.Planned,"Planned","plan");
    h += kpi(bySt.Diff,"Diff","diff");
    h += kpi(bySt.Unverified||0,"Missing evidence","");
    h += kpi(parity+"%","Parity Score","parity");
    h += kpi(conflicts,"Conflicts","slip");
    h += '</div>';

    // Journey health
    h += '<div class="section"><h2>Journey Health</h2><table>';
    h += '<tr><th>Journey</th><th>Total</th><th>Live</th><th>Gap</th><th>Planned</th><th>Missing evidence</th><th>Diff</th><th>Parity</th><th style="min-width:140px"></th></tr>';
    journeyData.forEach(j=>{
      const pc = j.parity >= 70 ? "#20C992" : j.parity >= 40 ? "#F1B53D" : "#F43653";
      h += '<tr>';
      h += '<td>'+esc(j.journey)+'</td>';
      h += '<td>'+j.total+'</td>';
      h += '<td style="color:#20C992">'+j.live+'</td>';
      h += '<td style="color:#F43653">'+j.gap+'</td>';
      h += '<td style="color:#00B2FF">'+j.planned+'</td>';
      h += '<td style="color:#808080">'+j.unverified+'</td>';
      h += '<td style="color:#F1B53D">'+j.diff+'</td>';
      h += '<td style="color:'+pc+';font-weight:700">'+j.parity+'%</td>';
      h += '<td><div class="bar-track"><div class="bar-fill" style="width:'+j.parity+'%;background:'+pc+'"></div><div class="bar-label">'+j.parity+'%</div></div></td>';
      h += '</tr>';
    });
    h += '</table></div>';

    // Quarterly delivery
    if(qKeys.length){
      h += '<div class="section"><h2>Quarterly Delivery Pipeline</h2><table>';
      h += '<tr><th>Quarter</th><th>Features</th><th>Details</th></tr>';
      qKeys.forEach(q=>{
        const items = quarters[q];
        const names = items.slice(0,5).map(f=>esc(f.name)).join(", ") + (items.length>5 ? " + "+(items.length-5)+" more" : "");
        h += '<tr><td style="font-weight:700">'+esc(q)+'</td><td>'+items.length+'</td><td style="color:#A2E3FF;font-size:11px">'+names+'</td></tr>';
      });
      h += '</table></div>';
    }

    // Top gaps
    h += '<div class="section"><h2>Top Gaps (by Priority)</h2><table>';
    h += '<tr><th>ID</th><th>Feature</th><th>Status</th><th>Journey</th><th>Priority</th><th>Competitors</th></tr>';
    gaps.forEach(f=>{
      h += '<tr>';
      const fst=ds(f);
      const pcls=fst==="Gap"?"gap":"gap-unconfirmed";
      h += '<td style="color:#A2E3FF">'+esc(f.id||"-")+'</td>';
      h += '<td>'+esc(f.name)+(f.status_conflict?' <span style="color:#FF7514;font-size:9px">⚠ was '+esc(f.status)+'</span>':'')+'</td>';
      h += '<td><span class="pill '+pcls+'">'+esc(fst)+'</span></td>';
      h += '<td>'+esc(f.journey||"-")+'</td>';
      h += '<td style="font-weight:700;color:#F1B53D">'+(f.priority!=null?f.priority:"-")+'</td>';
      h += '<td style="color:#F43653;font-size:11px">'+esc((f.competitors||[]).join(", ")||"-")+'</td>';
      h += '</tr>';
    });
    h += '</table></div>';

    // Backend split (IBKR/GTN)
    const splits = features.filter(f=>f.backends && Object.keys(f.backends).length);
    if(splits.length){
      h += '<div class="section"><h2>US Backend Split — IBKR / GTN</h2>';
      h += '<div style="font-size:11px;color:#A2E3FF;margin-bottom:8px">Features whose live status differs by brokerage backend. Map status = most-advanced backend.</div>';
      h += '<table><tr><th>ID</th><th>Feature</th><th>Area</th><th>IBKR</th><th>GTN</th></tr>';
      const bpill=s=>{const c={Live:"live",Planned:"planned",Gap:"gap",Diff:"diff"}[s]||"";return '<span class="pill '+c+'">'+esc(s||"—")+'</span>';};
      splits.sort((a,b)=>(a.id||"").localeCompare(b.id||"")).forEach(f=>{
        h += '<tr><td style="color:#A2E3FF">'+esc(f.id||"-")+'</td><td>'+esc(f.name)+'</td>';
        h += '<td style="color:#888">'+esc(f.area||"-")+'</td>';
        h += '<td>'+bpill(f.backends.IBKR)+'</td><td>'+bpill(f.backends.GTN)+'</td></tr>';
      });
      h += '</table></div>';
    }

    // Differentiators
    if(diffs.length){
      h += '<div class="section"><h2>ARC Differentiators</h2><table>';
      h += '<tr><th>ID</th><th>Feature</th><th>Journey</th><th>Source</th></tr>';
      diffs.forEach(f=>{
        h += '<tr>';
        h += '<td style="color:#A2E3FF">'+esc(f.id||"-")+'</td>';
        h += '<td>'+esc(f.name)+'</td>';
        h += '<td>'+esc(f.journey||"-")+'</td>';
        h += '<td style="color:#888;font-size:11px">'+esc(f.source||"-")+'</td>';
        h += '</tr>';
      });
      h += '</table></div>';
    }

    // Attention queue
    if(attention.length){
      h += '<div class="section"><h2>Attention Queue</h2>';
      attention.forEach(a=>{
        h += '<div class="att-item"><strong>'+esc(a.id||"")+'</strong> '+esc(a.name)+'<div class="reason">'+esc(a.reason)+'</div></div>';
      });
      h += '</div>';
    }

    // Footer
    h += '<div class="footer">Data: '+esc(meta.last_updated||"unknown")+' &middot; Generated by '+esc(meta.generated_by||"xlsx-to-features-json.py")+'</div>';

    document.getElementById("app").innerHTML = h;
  }

  function kpi(v,l,cls){
    return '<div class="kpi '+cls+'"><div class="v">'+v+'</div><div class="l">'+esc(l)+'</div></div>';
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
})();
</script>
<script src="_trustbar.js"></script>
</body>
</html>
